version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/ipmc
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE: 30d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ipmc-ng.com}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8081}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${CLIENT_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  mongo_data:
  server_uploads:
