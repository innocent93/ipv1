version: '3.8'
services:
  backup:
    image: mongo:7
    volumes:
      - /var/backups/ipmc:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ipmc
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    command: >
      sh -c "apt-get update && apt-get install -y cron awscli && 
             echo '0 2 * * * /backup.sh >> /var/log/cron.log 2>&1' | crontab - && 
             cron -f"
    depends_on:
      - mongo
    networks:
      - ipmc-network
